# Checks every push and pull request: type check, unit tests and a full production build.
# Deploying stays manual (`npx wrangler deploy`), so no Cloudflare secrets are stored in GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      # `npm run build` runs the tests first (prebuild), then copies fonts, writes ads.txt and builds the site.
      - run: npm run build
      - name: Validate all translations
        run: node scripts/check-locale.mjs
