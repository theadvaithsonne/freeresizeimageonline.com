name = "frio-counters"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Only reachable on counters.freeresizeimageonline.com (no public *.workers.dev address).
workers_dev = false

# Only these sites may open the live-counter connection.
[vars]
ALLOWED_ORIGINS = "https://freeresizeimageonline.com,https://www.freeresizeimageonline.com"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# The Worker is served on its own subdomain (Cloudflare creates the DNS record and certificate by itself).
[[routes]]
pattern = "counters.freeresizeimageonline.com"
custom_domain = true
